 <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IO Móvil Dorado</title>
<link rel="manifest" href="manifest.json">
<style>
body{margin:0;font-family:sans-serif;min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;align-items:center;justify-content:center;padding:14px}
.card{background:#fffef5;border:2px solid #FFD700;border-radius:28px;padding:22px 18px;max-width:380px;width:100%;text-align:center;box-shadow:0 0 30px rgba(255,215,0,.3)}
.avatar{width:110px;height:110px;margin:0 auto 10px;background:radial-gradient(circle,#FFF9C4,#FFD700 40%,#B8860B);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:48px;color:#2a145a}
h1{margin:8px 0 2px;color:#2a145a} p{margin:0 0 10px;color:#666}
input{width:100%;margin-top:14px;padding:14px 16px;border-radius:999px;border:2px solid #f1d85a;box-sizing:border-box;font-size:16px}
button{width:100%;margin-top:10px;padding:14px;border-radius:999px;border:0;background:#302b63;color:#fff;font-weight:900;font-size:16px}
</style>
</head>
<body>
<div class="card">
<div class="avatar">IO</div>
<h1>IO Móvil</h1>
<p>Navegación Cuántica Dorada</p>
<input id="url" type="text" value="http://" placeholder="ej: google.com">
<button onclick="ir()">Navegar Directo</button>
</div>
<script>
function ir(){let u=document.getElementById('url').value.trim();if(!u||u=='http://')return;if(!u.startsWith('http://')&&!u.startsWith('https://'))u='http://'+u;location.href=u;}
document.getElementById('url').addEventListener('keydown',e=>{if(e.key==='Enter')ir()});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
